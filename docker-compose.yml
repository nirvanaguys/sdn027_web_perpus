version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: perpus_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: perpustakaan
      MYSQL_USER: user_perpus
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: perpus_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  db_data:
